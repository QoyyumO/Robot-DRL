# ============================================================
# Vision-Based Robotic Arm Control — PPO GPU/Headless Config
# Algorithm: Proximal Policy Optimization (Schulman et al., 2017)
# ============================================================

ppo:
  learning_rate: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  n_steps: 128              # rollout steps per env before each PPO update
  n_epochs: 4               # passes over rollout data per update
  batch_size: 256
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5

network:
  dense_units: 512
  conv_filters: [32, 64, 64]
  conv_kernels: [8, 4, 3]
  conv_strides: [4, 2, 1]

environment:
  camera_width: 320
  camera_height: 240
  physics_time_step: 0.016667
  gravity: -10.0
  max_steps_per_episode: 500
  joint_delta: 0.03
  joint_force: 100
  completion_radius: 0.08
  early_truncation_threshold: -1
  camera_distance: 1.5
  camera_yaw: 60
  camera_pitch: -30
  camera_target: [0.5, 0.0, 0.08]
  camera_fov: 60
  target_x_min: 0.25
  target_x_max: 0.85
  target_y_min: -0.35
  target_y_max: 0.35
  target_z_min: 0.05
  target_z_range: 0.08

rewards:
  closer: 1.0
  farther: -1.0
  same: 0.0
  success_bonus: 5.0

preprocessing:
  width: 84
  height: 84
  bilateral_d: 9
  bilateral_sigma_color: 75.0
  bilateral_sigma_space: 75.0

training:
  checkpoint_every: 100
  log_every: 10
  mixed_precision: true
  n_envs: 4
