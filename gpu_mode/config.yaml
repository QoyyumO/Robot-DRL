# ============================================================
# Vision-Based Robotic Arm Control — GPU/Headless Training Config
# ============================================================

# --- DQN Training Hyperparameters ---
dqn:
  learning_rate: 2.5e-4
  gamma: 0.99              # discount factor
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 100000  # longer decay: more env steps before exploitation
  buffer_size: 100000      # larger buffer: more diverse experience for bigger batches
  batch_size: 256          # T4 has 2560 CUDA cores — batch 32 uses ~1% of them
  target_update_freq: 1000 # gradient steps between target network syncs

# --- Neural Network Architecture ---
network:
  dense_units: 512
  conv_filters: [32, 64, 64]
  conv_kernels: [8, 4, 3]
  conv_strides: [4, 2, 1]

# --- Environment / Simulation ---
environment:
  camera_width: 320        # raw PyBullet camera resolution
  camera_height: 240
  physics_time_step: 0.016667  # seconds per step (1/60 Hz)
  gravity: -10.0
  max_steps_per_episode: 500
  joint_delta: 0.03        # radians per action step
  joint_force: 100         # motor force (N)
  completion_radius: 0.08  # success threshold in metres (8 cm)
  early_truncation_threshold: -1  # truncate when sum(last 3 rewards) < this
  # Camera view
  camera_distance: 1.5
  camera_yaw: 60
  camera_pitch: -30
  camera_target: [0.5, 0.0, 0.08]
  camera_fov: 60
  # Target position sampling bounds
  target_x_min: 0.25
  target_x_max: 0.85
  target_y_min: -0.35
  target_y_max: 0.35
  target_z_min: 0.05
  target_z_range: 0.08     # z uniformly sampled in [z_min, z_min + z_range]

# --- Reward Shaping ---
rewards:
  closer: 1.0
  farther: -1.0
  same: 0.0
  success_bonus: 5.0

# --- Image Preprocessing ---
preprocessing:
  width: 84
  height: 84
  bilateral_d: 9
  bilateral_sigma_color: 75.0
  bilateral_sigma_space: 75.0

# --- Training Loop Defaults ---
training:
  checkpoint_every: 100    # save checkpoint every N episodes
  log_every: 10            # print progress every N episodes
  train_freq: 4            # collect this many env steps before each training round
  gradient_steps: 2        # gradient updates per training round
  mixed_precision: true    # FP16 on T4 tensor cores: 65 TFLOPS vs 8.1 TFLOPS FP32
